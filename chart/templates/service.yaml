apiVersion: v1
kind: Service
metadata:
  name: {{ include "langop-dashboard.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "langop-dashboard.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - name: http
    port: {{ .Values.service.port }}
    protocol: TCP
    targetPort: http
  selector:
    {{- include "langop-dashboard.selectorLabels" . | nindent 4 }}
