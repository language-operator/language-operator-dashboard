apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "langop-dashboard.fullname" . }}
  labels:
    {{- include "langop-dashboard.labels" . | nindent 4 }}
rules:
# Read langop.io resources for SSE watch streams
- apiGroups:
  - langop.io
  resources:
  - languageclusters
  - languageagents
  - languagemodels
  - languagetools
  - languagepersonas
  verbs:
  - get
  - list
  - watch
# Read pods for agent status and log streaming
- apiGroups:
  - ""
  resources:
  - pods
  - pods/log
  verbs:
  - get
  - list
  - watch
# Exec into agent pods for workspace/terminal access
- apiGroups:
  - ""
  resources:
  - pods/exec
  verbs:
  - create
  - get
# Read namespaces for cluster existence validation
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
