{{- if .Values.adminServiceAccount.create -}}
# Binds the admin SA to the langop-admin ClusterRole from the language-operator chart.
# This allows operators to generate a first-login bearer token:
#   kubectl create token {{ .Values.adminServiceAccount.name }} -n {{ .Release.Namespace }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "langop-dashboard.fullname" . }}-admin
  labels:
    {{- include "langop-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.adminServiceAccount.clusterRoleName }}
subjects:
- kind: ServiceAccount
  name: {{ .Values.adminServiceAccount.name }}
  namespace: {{ .Release.Namespace }}
{{- end }}
