{{- $secretName := include "langop-dashboard.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "langop-dashboard.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.auth.secret }}
  NEXTAUTH_SECRET: {{ .Values.auth.secret | b64enc | quote }}
  {{- else if $existing }}
  NEXTAUTH_SECRET: {{ index $existing.data "NEXTAUTH_SECRET" }}
  {{- else }}
  NEXTAUTH_SECRET: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
